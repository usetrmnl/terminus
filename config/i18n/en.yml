          other: less than %{count} minutes
        less_than_x_seconds:
          one: less than %{count} second
          other: less than %{count} seconds
        over_x_years:
          one: over %{count} year
          other: over %{count} years
        x_days:
          one: "%{count} day"
          other: "%{count} days"
        x_minutes:
          one: "%{count} minute"
        x_months:
          one: "%{count} month"
          other: "%{count} months"
          other: "%{count} minutes"
